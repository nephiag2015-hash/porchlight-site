<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Porch Light</title>
<meta name="description" content="See whether a friend's porch light is on.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a1a2e">
<link rel="apple-touch-icon" href="/porch-light-icon.png">
<link rel="icon" type="image/png" href="/porch-light-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --navy:#1a1a2e; --amber:#f4a523; --text:#eaeaf2; --muted:#a8a8bd; --card:#232340; --line:#34345a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Inter',sans-serif; color:var(--text); background:var(--navy);
    background:radial-gradient(ellipse at 50% 0%, #2a2a4a 0%, var(--navy) 60%);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:calc(28px + env(safe-area-inset-top)) 22px 40px; text-align:center;
    transition:background 0.6s ease;
  }
  body.on, body.glow { background:radial-gradient(ellipse at 50% 30%, #3a2e1e 0%, var(--navy) 65%); }
  .brand { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:.9rem; margin-bottom:34px; text-decoration:none; }
  .brand img { width:30px; height:30px; border-radius:8px; }

  /* The light itself — the same bulb as the app's Home screen: a 156px disc
     with the 💡 inside, dim glass when off, solid amber with a gold ring when
     on, and a breathing halo only while glowing. */
  .lamp { position:relative; width:156px; height:156px; margin-bottom:30px; }
  .lamp .halo {
    position:absolute; inset:-60px; border-radius:50%;
    background:radial-gradient(circle, rgba(244,165,35,0.55) 0%, rgba(244,165,35,0.18) 40%, rgba(244,165,35,0) 70%);
    opacity:0; transform:scale(0.6); transition:opacity 0.7s ease, transform 0.7s ease;
  }
  .lamp .bulb {
    position:absolute; inset:0; border-radius:50%;
    background:#2a2a4e; border:3px solid #3a3a5c;
    display:flex; align-items:center; justify-content:center;
    font-size:54px; line-height:1;
    transition:background 0.7s ease, border-color 0.7s ease, box-shadow 0.7s ease;
  }
  .lamp .bulb span { opacity:.3; transition:opacity 0.7s ease; }
  body.on .lamp .bulb, body.glow .lamp .bulb {
    background:var(--amber); border-color:#ffcc66; box-shadow:0 0 50px 8px rgba(244,165,35,0.4);
  }
  body.on .lamp .bulb span, body.glow .lamp .bulb span { opacity:1; }
  body.glow .lamp .halo { opacity:1; transform:scale(1); animation:breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform:scale(1); } 50% { transform:scale(1.18); } }
  body.loading .lamp { opacity:.5; }

  h1 { font-family:'Fraunces',serif; font-size:clamp(1.6rem,6vw,2.3rem); font-weight:600; line-height:1.2; margin-bottom:10px; min-height:1.2em; }
  h1 em { font-style:italic; color:var(--amber); }
  .sub { color:var(--muted); font-size:1.02rem; line-height:1.55; max-width:24rem; margin-bottom:30px; min-height:1.5em; }

  .btn {
    display:block; width:100%; max-width:22rem; padding:15px 22px; border-radius:14px; border:0;
    font-family:inherit; font-weight:600; font-size:1.02rem; text-decoration:none; cursor:pointer;
    margin:0 auto 12px; transition:transform 0.15s ease, background 0.15s ease;
  }
  .btn:active { transform:scale(0.98); }
  .btn-ghost { background:var(--card); color:var(--text); border:1px solid var(--line); }
  .btn[hidden] { display:none; }
  .how { color:var(--muted); font-size:.9rem; line-height:1.55; max-width:24rem; margin:26px auto 0; }
  .how b { color:var(--text); font-weight:500; }
  footer { margin-top:auto; padding-top:30px; color:var(--muted); font-size:.85rem; }
  footer a { color:var(--muted); }
</style>
</head>
<body class="loading">
  <a class="brand" href="/"><img src="/porch-light-icon.png" alt=""><span id="brand">Porch Light</span></a>

  <div class="lamp" aria-hidden="true"><div class="halo"></div><div class="bulb"><span>💡</span></div></div>

  <h1 id="t1">Checking the light…</h1>
  <p class="sub" id="sub"></p>

  <a class="btn btn-ghost" id="getApp" hidden href="#">Get the app</a>

  <p class="how" id="how" hidden></p>

  <footer><a href="/">theporchlightapp.com</a></footer>

<script>
  var q = new URLSearchParams(location.search);
  var code = (q.get('f') || '').replace(/[^a-z0-9]/gi, '').toUpperCase();
  var DB = 'https://rd-place-85a13-default-rtdb.firebaseio.com/lights/' + code + '.json';

  // Localize for the reader: browser language decides, ?l= overrides.
  var I18N = {
    en: {
      checking: 'Checking the light…',
      missing: "This light isn't shared", missingSub: 'Ask your friend for a fresh link.',
      off: function (n) { return n + "'s light is <em>off</em>"; }, offSub: 'Not right now. Check back later.',
      on: function (n) { return n + "'s light is <em>on</em>"; }, onSub: 'Free to talk. Go ahead and call — no need to text first.',
      glow: function (n) { return n + "'s light is <em>glowing</em>"; }, glowSub: 'Really hoping to talk right now. This is a good moment to call.',
      app: 'Get the app',
      how: function (n) { return '<b>Porch Light</b> is a porch light for your phone. When ' + n + "'s light is on, they're free for a call. When it's off, they're not — nothing to read into."; }
    },
    es: {
      checking: 'Consultando la luz…',
      missing: 'Esta luz no está compartida', missingSub: 'Pídele a tu amigo un enlace nuevo.',
      off: function (n) { return 'La luz de ' + n + ' está <em>apagada</em>'; }, offSub: 'Ahora no. Vuelve más tarde.',
      on: function (n) { return 'La luz de ' + n + ' está <em>encendida</em>'; }, onSub: 'Puede hablar. Llama sin más — no hace falta avisar antes.',
      glow: function (n) { return 'La luz de ' + n + ' está <em>radiante</em>'; }, glowSub: 'Tiene muchas ganas de hablar ahora mismo. Buen momento para llamar.',
      app: 'Descargar la app',
      how: function (n) { return '<b>Porch Light</b> es una luz de porche para tu teléfono. Cuando la luz de ' + n + ' está encendida, puede hablar. Cuando está apagada, no — sin nada que interpretar.'; }
    },
    pt: {
      checking: 'Conferindo a luz…',
      missing: 'Esta luz não está compartilhada', missingSub: 'Peça ao seu amigo um link novo.',
      off: function (n) { return 'A luz de ' + n + ' está <em>apagada</em>'; }, offSub: 'Agora não. Volte mais tarde.',
      on: function (n) { return 'A luz de ' + n + ' está <em>acesa</em>'; }, onSub: 'Pode conversar. Pode ligar — não precisa avisar antes.',
      glow: function (n) { return 'A luz de ' + n + ' está <em>radiante</em>'; }, glowSub: 'Está com muita vontade de conversar agora. Bom momento para ligar.',
      app: 'Baixar o app',
      how: function (n) { return '<b>Porch Light</b> é uma luz de varanda para o seu celular. Quando a luz de ' + n + ' está acesa, dá para ligar. Quando está apagada, não — sem nada a interpretar.'; }
    },
    fr: {
      checking: 'Vérification de la lumière…',
      missing: "Cette lumière n'est pas partagée", missingSub: 'Demande un nouveau lien à ton ami.',
      off: function (n) { return 'La lumière de ' + n + ' est <em>éteinte</em>'; }, offSub: 'Pas maintenant. Reviens plus tard.',
      on: function (n) { return 'La lumière de ' + n + ' est <em>allumée</em>'; }, onSub: "Disponible pour parler. Appelle directement — pas besoin d'écrire avant.",
      glow: function (n) { return 'La lumière de ' + n + ' <em>brille</em>'; }, glowSub: "Il a très envie de parler en ce moment. C'est le bon moment pour appeler.",
      app: "Télécharger l'appli",
      how: function (n) { return "<b>Porch Light</b>, c'est une lumière de porche pour ton téléphone. Quand la lumière de " + n + " est allumée, il est disponible pour un appel. Éteinte, il ne l'est pas — rien à interpréter."; }
    }
  };
  var lang = ((q.get('l') || navigator.language || 'en') + '').toLowerCase().slice(0, 2);
  var T = I18N[lang] || I18N.en;
  if (I18N[lang]) document.documentElement.lang = lang;

  var $ = function (id) { return document.getElementById(id); };
  var row = null;        // mirror row from lights/{code}, null = not shared
  var loaded = false;

  function stateOf(r) {
    if (!r) return 'missing';
    if (typeof r.glowUntil === 'number' && r.glowUntil > Date.now() && r.on) return 'glow';
    return r.on ? 'on' : 'off';
  }

  function render() {
    var state = loaded ? stateOf(row) : 'loading';
    document.body.className = state;
    var name = (row && row.name) || '';
    if (state === 'loading') { $('t1').textContent = T.checking; $('sub').textContent = ''; }
    else if (state === 'missing') { $('t1').textContent = T.missing; $('sub').textContent = T.missingSub; }
    else { $('t1').innerHTML = T[state](name); $('sub').textContent = T[state + 'Sub']; }
    document.title = name ? name + ' — Porch Light' : 'Porch Light';
    var shared = loaded && !!row;
    $('getApp').hidden = !shared;
    $('how').hidden = !shared;
    if (shared) {
      $('getApp').href = '/add/?f=' + code;
      $('getApp').textContent = T.app;
      $('how').innerHTML = T.how(name);
    }
  }

  // ---- Live updates: Firebase REST streaming (EventSource), polling fallback.
  function apply(data) { row = data && typeof data === 'object' ? data : null; loaded = true; render(); }
  var pollTimer = null;
  function poll() {
    if (pollTimer) return;
    var tick = function () { fetch(DB, { cache: 'no-store' }).then(function (r) { return r.json(); }).then(apply).catch(function () { loaded = true; render(); }); };
    tick(); pollTimer = setInterval(tick, 30000);
  }
  function stream() {
    if (!('EventSource' in window)) { poll(); return; }
    var es = new EventSource(DB);
    es.addEventListener('put', function (e) {
      var m = JSON.parse(e.data);
      if (m.path === '/') { apply(m.data); return; }
      var r = Object.assign({}, row || {}); r[m.path.replace(/^\//, '')] = m.data; apply(r);
    });
    es.addEventListener('patch', function (e) { var m = JSON.parse(e.data); apply(Object.assign({}, row || {}, m.data || {})); });
    es.onerror = function () { es.close(); poll(); };
  }
  if (code) stream(); else { loaded = true; render(); }
  // Glow stamps lapse without a write, so re-check the state on a clock.
  setInterval(function () { if (loaded) render(); }, 15000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && loaded) render(); });

  render();
</script>
</body>
</html>
