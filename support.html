<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support - Porch Light</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 40px 20px;
      line-height: 1.6;
    }
    .container { max-width: 560px; margin: 0 auto; }
    .back { margin-bottom: 32px; display: inline-block; color: #f4a523; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    h1 {
      font-size: 1.8rem;
      color: #e0e0e0;
      margin-bottom: 24px;
      font-weight: 600;
    }
    .section-title {
      color: #f4a523;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .intro {
      background: #22223a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      border-left: 3px solid #f4a523;
      color: #e8e8ed;
      font-size: 0.95rem;
    }
    .field-label {
      color: #8b8b9e;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
      display: block;
    }
    .type-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .type-btn {
      flex: 1;
      background: #22223a;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      border: 1px solid #3a3a5a;
      color: #8b8b9e;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .type-btn.active {
      border-color: #f4a523;
      background: #2a2a4e;
      color: #f4a523;
    }
    textarea {
      width: 100%;
      background: #22223a;
      border-radius: 12px;
      padding: 16px;
      color: #e0e0e0;
      font-size: 0.95rem;
      min-height: 150px;
      border: 1px solid #3a3a5a;
      margin-bottom: 20px;
      font-family: inherit;
      resize: vertical;
    }
    textarea::placeholder { color: #6b6b82; }
    textarea:focus { outline: none; border-color: #f4a523; }
    .submit-btn {
      width: 100%;
      background: #f4a523;
      border: none;
      border-radius: 12px;
      padding: 16px;
      color: #1a1a2e;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .submit-btn:hover { background: #ffb733; }
    .note {
      margin-top: 16px;
      color: #6b6b82;
      font-size: 0.85rem;
      text-align: center;
    }
    .note a { color: #f4a523; text-decoration: none; }
    .note a:hover { text-decoration: underline; }
    .footer {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid #2a2a4e;
      color: #8b8b9e;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back">&larr; Back</a>
    <h1>Support</h1>

    <div class="section-title">Share Your Thoughts</div>
    <div class="intro">We're building Porch Light to help people stay connected. Your feedback directly shapes what we build next! 💛</div>

    <label class="field-label">What type of feedback?</label>
    <div class="type-row" id="typeRow">
      <div class="type-btn active" data-type="feature" data-placeholder="I wish Porch Light could...">💡 New Feature</div>
      <div class="type-btn" data-type="bug" data-placeholder="I found an issue where...">🐛 Bug</div>
      <div class="type-btn" data-type="other" data-placeholder="What I love about Porch Light is...">💛 Other</div>
    </div>

    <label class="field-label">Your feedback</label>
    <textarea id="feedbackText" placeholder="I wish Porch Light could..."></textarea>

    <button class="submit-btn" id="submitBtn" onclick="sendFeedback()">Send Feedback</button>
    <p class="note" id="note">We read every message and reply if you leave a way to reach you.</p>

    <div class="footer">
      <p>&copy; 2025 Porch Light. All rights reserved.</p>
    </div>
  </div>

  <script>
    let selectedType = 'feature';
    document.querySelectorAll('.type-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedType = btn.dataset.type;
        document.getElementById('feedbackText').placeholder = btn.dataset.placeholder;
      });
    });

    const ENDPOINT = 'https://us-central1-rd-place-85a13.cloudfunctions.net/submitWebFeedback';

    async function sendFeedback() {
      const textEl = document.getElementById('feedbackText');
      const text = textEl.value.trim();
      if (!text) {
        alert('Please write something before submitting.');
        return;
      }
      const btn = document.getElementById('submitBtn');
      const note = document.getElementById('note');
      btn.disabled = true;
      btn.textContent = 'Sending...';
      try {
        const res = await fetch(ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: selectedType, text }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'Failed');
        textEl.value = '';
        btn.textContent = 'Sent!';
        note.textContent = 'Thanks — your feedback helps make Porch Light better for everyone. 💛';
        setTimeout(() => { btn.disabled = false; btn.textContent = 'Send Feedback'; }, 3000);
      } catch (e) {
        btn.disabled = false;
        btn.textContent = 'Send Feedback';
        note.textContent = "Couldn't send — please try again in a moment.";
      }
    }
  </script>
</body>
</html>
