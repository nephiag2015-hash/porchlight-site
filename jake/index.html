<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porch Light</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/porch-light-icon.png">
<style>body { background:#1a1a2e; color:#eaeaf2; font-family:sans-serif; text-align:center; padding:40px 22px; } a { color:#f4a523; }</style>
</head>
<body>
<noscript><a href="/">Continue to Porch Light</a></noscript>
<script>
  // Street-flyer QR lands here. Add one to metrics/flyer/jake/scan in the app's
  // database (add-one-only rule in porchlight/database.rules.json), once per
  // phone, then hand off to the homepage, which shows the Jake header on #jake.
  var bump = function () {
    try {
      fetch('https://rd-place-85a13-default-rtdb.firebaseio.com/metrics/flyer/jake/scan.json', {
        method: 'PUT', keepalive: true, body: JSON.stringify({ '.sv': { increment: 1 } })
      }).catch(function () {});
    } catch (e) { /* counting is a nicety, never block the page */ }
  };
  try {
    if (!localStorage.getItem('jakeScan')) { localStorage.setItem('jakeScan', '1'); bump(); }
  } catch (e) { bump(); }
  location.replace('/#jake');
</script>
</body>
</html>
